[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bfg-py"
version = "3.0.0"
description = "Cross-platform Doom launcher with legacy-compatible UI and automation workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "defusedxml>=0.7.1",
  "numpy>=1.19.0",
  "Pillow>=8.0.0",
  "psutil>=5.8.0",
  "PyQt5>=5.15.2",
  "requests>=2.25.1",
]

[project.scripts]
bfg = "bfg.cli:main"
bfg-perf = "bfg.tools.performance_test:run_performance_test"
bfg-contrast-check = "bfg.tools.test_contrast:run_contrast_check"
bfg-layout-check = "bfg.tools.test_layout:run_layout_check"
bfg-optimize = "bfg.tools.optimize:main"

[project.optional-dependencies]
dev = [
  "autopep8>=1.5.5",
  "pycodestyle>=2.6.0",
  "pytest>=8.4.2",
  "pytest-qt>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "bfg"]

[tool.pytest.ini_options]
# The repo has no automated test suite yet; the *test_*.py files under
# bfg/tools/ are interactive GUI smoke scripts that must never be collected
# (they would hang on a modal Qt event loop).
norecursedirs = ["bfg/tools", "src", ".venv", "assets"]

[tool.uv]
managed = true
