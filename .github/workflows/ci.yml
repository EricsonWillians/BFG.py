name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # PyQt5 needs a display; on headless runners fall back to the offscreen
  # platform (Linux additionally uses xvfb below for full widget support).
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Compile all modules
        run: python -m compileall -q src bfg

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q

      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: pytest -q
